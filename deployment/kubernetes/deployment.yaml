apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-platform-deployment
  namespace: trading-platform
  labels:
    app: trading-platform
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trading-platform
  template:
    metadata:
      labels:
        app: trading-platform
    spec:
      containers:
        - name: trading-platform
          image: registry.enterprise.com/trading/platform:v1.28.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: trading-platform-config
            - secretRef:
                name: trading-platform-secret
          readinessProbe:
            httpGet:
              path: /api/contact
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/contact
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
