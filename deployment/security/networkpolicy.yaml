apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-platform-netpol
  namespace: trading-platform
spec:
  podSelector:
    matchLabels:
      app: trading-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6379
