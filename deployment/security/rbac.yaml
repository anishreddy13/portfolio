apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trading-platform-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trading-platform-cluster-rolebinding
subjects:
  - kind: ServiceAccount
    name: trading-platform-sa
    namespace: trading-platform
roleRef:
  kind: ClusterRole
  name: trading-platform-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trading-platform-role
  namespace: trading-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trading-platform-rolebinding
  namespace: trading-platform
subjects:
  - kind: ServiceAccount
    name: trading-platform-sa
    namespace: trading-platform
roleRef:
  kind: Role
  name: trading-platform-role
  apiGroup: rbac.authorization.k8s.io
