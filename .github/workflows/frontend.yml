name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "tsconfig.json"
      - ".eslintrc.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "tsconfig.json"
      - ".eslintrc.json"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
